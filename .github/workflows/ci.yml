name: CI

permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend Checks
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12.10'
          cache: 'pip'
          cache-dependency-path: requirements.lock

      - name: Install dependencies
        run: python -m pip install --require-hashes -r requirements.lock

      - name: Syntax check
        run: python -m compileall -q app config scripts test utils

      - name: Static lint
        uses: astral-sh/ruff-action@v4.1.0
        with:
          version: "0.15.21"
          args: "check --output-format=github"
          src: >-
            app config scripts test utils

      - name: Run tests
        run: python -m pytest --tb=short -q

  frontend:
    name: Frontend Contracts and Build
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12.10'
          cache: 'pip'
          cache-dependency-path: requirements.lock

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22.23.0'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: frontend

      - name: Install Python dependencies
        run: python -m pip install --require-hashes -r requirements.lock

      - name: Build
        run: npm run build:frontend
        env:
          HEIMDALL_PYTHON: python

      - name: Run frontend tests
        run: npm test
        working-directory: frontend

      - name: Verify generated contracts are committed
        run: >-
          git diff --exit-code --
          frontend/src/api/errors.ts
          frontend/src/api/routes.ts
          frontend/src/modules/market/generatedContracts.ts
          frontend/src/modules/system/generatedContracts.ts
          frontend/src/modules/tools/generatedContracts.ts
