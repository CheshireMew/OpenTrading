limit_req_zone $binary_remote_addr zone=opentrading_requests:8m rate=5r/s;
limit_req_zone $binary_remote_addr zone=opentrading_computations:1m rate=6r/m;
limit_conn_zone $binary_remote_addr zone=opentrading_connections:1m;
proxy_cache_path /srv/opentrading/shared/nginx-cache levels=1:2 keys_zone=opentrading_cache:8m max_size=128m inactive=10m;
map $http_upgrade $opentrading_connection_upgrade { default upgrade; '' close; }

server {
    listen 80;
    listen [::]:80;
    server_name trade.blacknico.com;
    location ^~ /.well-known/acme-challenge/ { root /srv/opentrading/shared/acme; }
    location / { return 308 https://trade.blacknico.com$request_uri; }
}
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name trade.blacknico.com;
    ssl_certificate /etc/letsencrypt/live/trade.blacknico.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/trade.blacknico.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    include /srv/opentrading/shared/cloudflare-real-ip.conf;
    root /srv/opentrading/current/frontend/dist;
    index index.html;
    autoindex off;
    server_tokens off;
    client_max_body_size 64k;
    client_body_timeout 10s;
    client_header_timeout 10s;
    keepalive_timeout 20s;
    limit_req_status 429;
    limit_conn_status 429;
    include /srv/opentrading/current/deployment/page-headers.conf;

    location ~ /\. { return 404; }
    location ~ ^/(docs|redoc|openapi\.json)(/|$) { return 404; }
    location = /health { proxy_pass http://127.0.0.1:4335/health; proxy_set_header Host trade.blacknico.com; }
    location /api/ {
        limit_req zone=opentrading_requests burst=30 nodelay;
        limit_conn opentrading_connections 12;
        proxy_pass http://127.0.0.1:4335;
        proxy_http_version 1.1;
        proxy_set_header Host trade.blacknico.com;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $opentrading_connection_upgrade;
        proxy_connect_timeout 5s;
        proxy_read_timeout 120s;
        proxy_cache opentrading_cache;
        proxy_cache_methods GET HEAD;
        proxy_cache_key "$scheme|$host|$request_uri|$http_origin";
        proxy_cache_valid 200 3s;
        proxy_cache_lock on;
        proxy_no_cache $http_upgrade;
        proxy_cache_bypass $http_upgrade;
        include /srv/opentrading/current/deployment/page-headers.conf;
        add_header Cache-Control no-store always;
    }
    location ~ ^/api/v1/(tools/(dca_simulate|compare_pairs)|research/screener-preview)$ {
        limit_req zone=opentrading_computations burst=2 nodelay;
        limit_conn opentrading_connections 2;
        proxy_pass http://127.0.0.1:4335;
        proxy_set_header Host trade.blacknico.com;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 120s;
        include /srv/opentrading/current/deployment/page-headers.conf;
        add_header Cache-Control no-store always;
    }
    location ~ ^/assets/[^/]+\.worker-[^/]+\.js$ {
        try_files $uri =404;
        include /srv/opentrading/current/deployment/common-headers.conf;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-eval'; connect-src 'self'; object-src 'none'" always;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
    location /assets/ {
        try_files $uri =404;
        include /srv/opentrading/current/deployment/page-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
    location / {
        try_files $uri $uri/ /index.html;
        include /srv/opentrading/current/deployment/page-headers.conf;
        add_header Cache-Control no-store always;
    }
}
