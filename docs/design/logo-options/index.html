:root { color-scheme: light; --bg: #fbfaf7; --ink: #10261f; --muted: #78716c; --line: #e4ded3; }
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: "Segoe UI", "Microsoft YaHei", sans-serif; transition: background .15s, color .15s; }
body.dark { color-scheme: dark; --bg: #151619; --ink: #f0f3fa; --muted: #959ca9; --line: #2a2b30; }
main { max-width: 1120px; padding: 32px 32px 48px; margin: auto; }
.top { display: flex; align-items: center; justify-content: space-between; gap: 24px; padding-bottom: 28px; border-bottom: 1px solid var(--line); }
h1 { font-size: 23px; font-weight: 600; letter-spacing: -.6px; margin: 0; }
.controls { display: flex; gap: 8px; }
button { font: inherit; font-size: 13px; color: var(--ink); background: transparent; border: 1px solid var(--line); border-radius: 5px; padding: 8px 12px; cursor: pointer; }
button:focus-visible, a:focus-visible { outline: 2px solid #22ab94; outline-offset: 4px; }
button[aria-pressed="true"] { border-color: var(--ink); }
.grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); }
article { padding: 24px 32px 32px; border-bottom: 1px solid var(--line); }
article:nth-child(odd) { border-right: 1px solid var(--line); }
.candidate-head { display: flex; align-items: center; justify-content: space-between; gap: 16px; }
h2 { font-size: 18px; font-weight: 600; margin: 0; }
h2 span { margin-left: 12px; font-size: 13px; font-weight: 400; color: var(--muted); }
a { font-size: 12px; color: var(--muted); text-underline-offset: 3px; }
.lockup { min-height: 270px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 20px; }
.hero-mark { width: 128px; height: 128px; }
.wordmark { font-size: 30px; font-weight: 600; letter-spacing: -1px; }
svg { display: block; width: 100%; height: 100%; }
.ink { fill: var(--ink); }
.samples { display: flex; align-items: center; justify-content: center; gap: 30px; height: 64px; }
.sample { display: inline-block; flex-shrink: 0; }
.s16 { width: 16px; height: 16px; } .s24 { width: 24px; height: 24px; }
.s32 { width: 32px; height: 32px; } .s48 { width: 48px; height: 48px; }
.mono :is(.accent-fill, .blue-fill, .positive-fill, .negative-fill) { fill: var(--ink); }
.mono .accent-stroke { stroke: var(--ink); }
@media (max-width: 680px) { main { padding: 20px 16px; } .top { flex-wrap: wrap; gap: 16px; } .grid { grid-template-columns: 1fr; } article { padding: 24px 12px; } article:nth-child(odd) { border-right: 0; } .lockup { min-height: 250px; } }
@media (prefers-reduced-motion: reduce) { body { transition: none; } }
</style>

<script>
const theme = document.getElementById('theme');
const mono = document.getElementById('mono');
theme.addEventListener('click', () => {
  const active = document.body.classList.toggle('dark');
  theme.setAttribute('aria-pressed', String(active));
  theme.textContent = active ? '浅色背景' : '深色背景';
});
mono.addEventListener('click', () => {
  const active = document.body.classList.toggle('mono');
  mono.setAttribute('aria-pressed', String(active));
  mono.textContent = active ? '彩色' : '单色';
});
</script>
