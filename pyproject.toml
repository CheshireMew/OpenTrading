[project]
name = "heimdall"
version = "2.0.0"
description = "Local market research and portfolio analysis application"
license = "AGPL-3.0-or-later"
requires-python = ">=3.12,<3.13"
dependencies = [
  "akshare>=1.18.0",
  "alembic>=1.13.0",
  "apscheduler>=3.10.0",
  "baostock>=0.8.9",
  "ccxt>=4.0.0",
  "fastapi>=0.100.0",
  "httpx>=0.24.0",
  "pandas>=2.0.0",
  "psycopg2-binary>=2.9.0",
  "pydantic-settings>=2.0.0",
  "pydantic>=2.0.0",
  "python-dotenv>=1.0.0",
  "pytrends>=4.9.2",
  "redis>=4.0.0",
  "requests>=2.31.0",
  "slowapi>=0.1.9",
  "sqlalchemy>=2.0.0",
  "ta-lib==0.6.8",
  "uvicorn>=0.20.0",
  "websockets>=15.0.0",
  "yfinance>=0.2.0",
]

[dependency-groups]
test = [
  "pytest>=7.4.0",
  "pytest-asyncio>=0.23.0",
]

[tool.pdm]
distribution = false
