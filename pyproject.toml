[project]
name = "opentrading"
version = "2.0.0"
description = "Market research, charting, and Pine strategy testing application"
license = "AGPL-3.0-or-later"
requires-python = ">=3.12,<3.13"
dependencies = [
  "certifi>=2026.10.19",
  "akshare>=1.18.0",
  "alembic>=1.13.0",
  "apscheduler>=3.10.0",
  "baostock>=0.8.9",
  "ccxt>=4.5.89",
  "exchange-calendars==4.13.2",
  "fastapi>=0.100.0",
  "httpx>=0.24.0",
  "mini-racer==0.14.1",
  "pandas>=2.0.0",
  "psycopg2-binary>=2.9.0",
  "pyarrow==23.0.1",
  "pydantic-settings>=2.0.0",
  "pydantic>=2.0.0",
  "python-dotenv>=1.0.0",
  "pytrends>=4.9.2",
  "requests>=2.31.0",
  "slowapi>=0.1.9",
  "sqlalchemy>=2.0.0",
  "ta-lib==0.6.8",
  "typer==0.26.8",
  "tzdata>=2026.2",
  "uvicorn>=0.20.0",
  "websockets>=15.0.0",
  "yfinance>=0.2.0",
]

[dependency-groups]
test = [
  "pytest>=7.4.0",
  "pytest-asyncio>=0.23.0",
]

[tool.pdm]
distribution = false

[tool.pdm.resolution]
# The maintained fork supplies the same py_mini_racer import on both platforms.
excludes = ["py-mini-racer"]

[tool.pdm.resolution.overrides]
aiohttp = ">=3.14.4"
mako = ">=1.4.2"
soupsieve = ">=4.0.0"
